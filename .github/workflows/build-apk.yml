name: Build APK

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      publish:
        description: Publish a rolling latest release
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

env:
  JAVA_VERSION: '21'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - uses: gradle/actions/setup-gradle@v4

      - name: Resolve the API origin
        id: api
        env:
          API_BASE_URL: ${{ vars.ANDROID_API_BASE_URL }}
        run: |
          set -euo pipefail
          url="${API_BASE_URL:-}"
          if [ -z "$url" ]; then
            echo "::error::set the ANDROID_API_BASE_URL repository variable"
            exit 1
          fi
          case "$url" in
            */) ;;
            *) echo "::error::ANDROID_API_BASE_URL must end with a slash"; exit 1 ;;
          esac
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - name: Decode signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
          chmod 600 "$RUNNER_TEMP/release.jks"

      - name: Build release APK
        env:
          API_URL: ${{ steps.api.outputs.url }}
          KEYSTORE_PATH: ${{ runner.temp }}/release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --console=plain "-PapiBaseUrl=$API_URL"

      - name: Collect the APK
        id: apk
        run: |
          set -euo pipefail
          version=$(grep -o 'versionName = "[^"]*"' app/build.gradle.kts | head -1 | cut -d'"' -f2)
          source=app/build/outputs/apk/release/app-release.apk
          [ -f "$source" ] || { echo "::error::no signed APK was produced"; exit 1; }
          name="EngStudy-$version-release.apk"
          mkdir -p out
          cp "$source" "out/$name"
          ( cd out && sha256sum "$name" > "$name.sha256" )
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.apk.outputs.name }}
          path: |
            out/${{ steps.apk.outputs.name }}
            out/${{ steps.apk.outputs.name }}.sha256
          retention-days: 30

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main' || inputs.publish
        env:
          GH_TOKEN: ${{ github.token }}
          NAME: ${{ steps.apk.outputs.name }}
          VERSION: ${{ steps.apk.outputs.version }}
        run: |
          set -euo pipefail
          if [ "${{ github.ref_type }}" = tag ]; then
            tag="${{ github.ref_name }}"
            title="EngStudy $VERSION"
            awk -v v="$VERSION" '
              $0 == "## " v || $0 == "## [" v "]" { flag = 1; next }
              /^## / && flag { flag = 0 }
              flag { print }
            ' CHANGELOG.md | awk 'NF { keep = 1 } keep' > "$RUNNER_TEMP/notes.md" || true
            if [ ! -s "$RUNNER_TEMP/notes.md" ]; then
              printf 'Release %s\n' "$VERSION" > "$RUNNER_TEMP/notes.md"
            fi
            printf '\n---\n\n- Commit: `%s`\n- Signed APK，附 sha256。\n' "$GITHUB_SHA" >> "$RUNNER_TEMP/notes.md"
            if gh release view "$tag" >/dev/null 2>&1; then
              gh release edit "$tag" --title "$title" --notes-file "$RUNNER_TEMP/notes.md"
            else
              gh release create "$tag" --title "$title" --notes-file "$RUNNER_TEMP/notes.md"
            fi
            gh release upload "$tag" "out/$NAME" "out/$NAME.sha256" --clobber
            echo "== published $tag"
          else
            tag=latest
            notes="滚动构建，来自 main。提交 ${GITHUB_SHA}，$(date -u +%Y-%m-%dT%H:%MZ)。正式版本见 tag v* 的 Release。"
            if gh release view "$tag" >/dev/null 2>&1; then
              gh release edit "$tag" --notes "$notes"
            else
              gh release create "$tag" --title "Latest build" --notes "$notes"
            fi
            gh release upload "$tag" "out/$NAME" "out/$NAME.sha256" --clobber
            echo "== published $tag"
          fi
